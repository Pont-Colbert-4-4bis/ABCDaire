name: Publish the residents guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an outdated deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "This revision is no longer main. Deploy the latest revision instead."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
